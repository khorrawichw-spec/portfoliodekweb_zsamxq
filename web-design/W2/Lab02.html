    <canvas id="myCanvas" style="border :1px solid;" width="400" height="120"></canvas> 
    <script>
        var display = document.getElementById("myCanvas");

        ctx.fillStyle = "#FF0000";
        ctx.fillRect(0,0,400,120);
        ctx.fillStyle = "#FF3300";
        ctx.fillRect(0,20,400,120);
        ctx.fillStyle = "#FFCC00";
        ctx.fillRect(0,40,400,120);
        ctx.fillStyle = "#009900";
        ctx.fillRect(0,60,400,120);
        ctx.fillStyle = "#000033";
        ctx.fillRect(0,80,400,120);
        ctx.fillStyle = "#330066";
        ctx.fillRect(0,100,400,120);
        
        
   

    </script>
