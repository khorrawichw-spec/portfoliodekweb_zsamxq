
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">

  <defs>
    <linearGradient id="glass" x1="100" y1="80" x2="650" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".35"></stop>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity=".06"></stop>
    </linearGradient>

    <linearGradient id="blue" x1="150" y1="100" x2="600" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A5F3FC"></stop>
      <stop offset=".5" stop-color="#38BDF8"></stop>
      <stop offset="1" stop-color="#6366F1"></stop>
    </linearGradient>

    <linearGradient id="shine" x1="150" y1="100" x2="550" y2="450" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity=".8"></stop>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"></stop>
    </linearGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"></feGaussianBlur>
      <feOffset dy="12"></feOffset>
      <feComponentTransfer>
        <feFuncA type="linear" slope=".18"></feFuncA>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="15"></feGaussianBlur>
    </filter>

    <clipPath id="windowClip">
      <rect x="180" y="125" width="440" height="320" rx="24"></rect>
    </clipPath>
  </defs>

  <!-- Soft glowing background -->
  <circle cx="230" cy="230" r="120" fill="#67E8F9" opacity=".2" filter="url(#glow)"></circle>
  <circle cx="580" cy="360" r="130" fill="#818CF8" opacity=".25" filter="url(#glow)"></circle>

  <!-- Decorative orbit -->
  <ellipse cx="400" cy="300" rx="300" ry="210" stroke="#FFFFFF" stroke-opacity=".2" stroke-width="1.5" stroke-dasharray="5 10" transform="rotate(-18 400 300)"></ellipse>

  <!-- Main glass window -->
  <g filter="url(#shadow)">
    <rect x="180" y="125" width="440" height="320" rx="24" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".65" stroke-width="1.5"></rect>

    <g clip-path="url(#windowClip)">
      <path d="M180 149 Q180 125 204 125 H596 Q620 125 620 149 V174 H180Z" fill="#FFFFFF" fill-opacity=".16"></path>
      <path d="M180 125 H620" stroke="#FFFFFF" stroke-opacity=".65"></path>

      <!-- Window controls -->
      <circle cx="207" cy="150" r="5" fill="#FCA5A5"></circle>
      <circle cx="225" cy="150" r="5" fill="#FDE68A"></circle>
      <circle cx="243" cy="150" r="5" fill="#86EFAC"></circle>

      <!-- Code lines -->
      <rect x="215" y="204" width="88" height="7" rx="3.5" fill="#A5F3FC"></rect>
      <rect x="215" y="225" width="145" height="7" rx="3.5" fill="#FFFFFF" fill-opacity=".75"></rect>
      <rect x="238" y="246" width="105" height="7" rx="3.5" fill="#C4B5FD"></rect>
      <rect x="238" y="267" width="155" height="7" rx="3.5" fill="#FFFFFF" fill-opacity=".5"></rect>
      <rect x="215" y="288" width="115" height="7" rx="3.5" fill="#7DD3FC"></rect>
      <rect x="215" y="309" width="170" height="7" rx="3.5" fill="#FFFFFF" fill-opacity=".65"></rect>

      <!-- Code brackets -->
      <path d="M418 215 L395 245 L418 275" stroke="#A5F3FC" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M467 215 L490 245 L467 275" stroke="#C4B5FD" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M454 207 L432 283" stroke="#FFFFFF" stroke-opacity=".85" stroke-width="5" stroke-linecap="round"></path>

      <!-- Bottom project preview -->
      <rect x="215" y="350" width="370" height="68" rx="14" fill="#FFFFFF" fill-opacity=".13" stroke="#FFFFFF" stroke-opacity=".3"></rect>
      <rect x="230" y="365" width="40" height="38" rx="10" fill="url(#blue)" fill-opacity=".85"></rect>
      <path d="M241 385 L249 375 L259 385 M249 375 V394" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
      <rect x="284" y="367" width="125" height="7" rx="3.5" fill="#FFFFFF" fill-opacity=".85"></rect>
      <rect x="284" y="383" width="85" height="5" rx="2.5" fill="#FFFFFF" fill-opacity=".4"></rect>
      <rect x="500" y="374" width="65" height="24" rx="12" fill="#FFFFFF" fill-opacity=".18" stroke="#FFFFFF" stroke-opacity=".5"></rect>
      <circle cx="512" cy="386" r="3" fill="#A5F3FC"></circle>
      <rect x="520" y="383" width="34" height="5" rx="2.5" fill="#FFFFFF" fill-opacity=".85"></rect>
    </g>
  </g>

  <!-- Floating glass card: design -->
  <g filter="url(#shadow)" transform="rotate(-9 150 195)">
    <rect x="65" y="155" width="125" height="100" rx="18" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".7"></rect>
    <rect x="81" y="172" width="93" height="48" rx="10" fill="url(#blue)" fill-opacity=".65"></rect>
    <circle cx="128" cy="196" r="13" fill="#FFFFFF" fill-opacity=".7"></circle>
    <path d="M111 232 H158" stroke="#FFFFFF" stroke-opacity=".8" stroke-width="5" stroke-linecap="round"></path>
    <path d="M111 243 H145" stroke="#FFFFFF" stroke-opacity=".4" stroke-width="4" stroke-linecap="round"></path>
  </g>

  <!-- Floating glass card: creativity -->
  <g filter="url(#shadow)" transform="rotate(8 650 380)">
    <rect x="610" y="320" width="115" height="105" rx="20" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".7"></rect>
    <path d="M667 339 L674 359 L695 366 L674 373 L667 394 L660 373 L639 366 L660 359Z" fill="#FFFFFF" fill-opacity=".9"></path>
    <circle cx="696" cy="344" r="5" fill="#A5F3FC"></circle>
    <circle cx="641" cy="397" r="4" fill="#C4B5FD"></circle>
  </g>

  <!-- Floating orbs -->
  <circle cx="120" cy="350" r="17" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".6"></circle>
  <circle cx="660" cy="180" r="23" fill="url(#glass)" stroke="#FFFFFF" stroke-opacity=".65"></circle>
  <circle cx="660" cy="180" r="8" fill="#FFFFFF" fill-opacity=".5"></circle>
  <circle cx="530" cy="485" r="9" fill="#A5F3FC" fill-opacity=".85"></circle>
  <circle cx="160" cy="440" r="6" fill="#FFFFFF" fill-opacity=".8"></circle>
  <path d="M695 250 L701 266 L717 272 L701 278 L695 294 L689 278 L673 272 L689 266Z" fill="#FFFFFF" fill-opacity=".8"></path>

  <!-- Bottom shine -->
  <path d="M245 470 Q400 510 555 470" stroke="url(#shine)" stroke-width="2" stroke-linecap="round"></path>

</svg>
